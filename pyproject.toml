[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-empire-mod-manager"
dynamic = ["version"]
description = "Star Empire Mod Manager packaging and build tooling (installer/tools packages) for external mod CI"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["installer", "tools"]

[tool.setuptools.dynamic]
version = {attr = "installer.version.MANAGER_VERSION"}
