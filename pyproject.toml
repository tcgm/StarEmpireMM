[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-empire-mod-manager"
version = "0.5.0"
description = "Star Empire Mod Manager packaging and build tooling (installer/tools packages) for external mod CI"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["installer", "tools"]
